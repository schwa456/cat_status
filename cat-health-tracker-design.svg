<svg width="1600" height="1200" viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg" style="background-color:#f9f9f9; font-family: 'Malgun Gothic', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444" />
    </marker>
  </defs>

  <text x="50" y="50" font-size="24" font-weight="bold" fill="#333">Cat Health Tracker - 디자인 설계도</text>
  <text x="50" y="80" font-size="16" fill="#666">이 파일을 Figma로 가져가서 프로젝트의 UI/UX를 구체화하세요.</text>

  <g id="sitemap">
    <text x="100" y="150" font-size="20" font-weight="bold" fill="#000">1. 사이트맵 (페이지 구조)</text>
    
    <rect x="100" y="200" width="180" height="50" rx="10" ry="10" fill="#fff" stroke="#ccc" stroke-width="2"/>
    <text x="190" y="230" text-anchor="middle" font-size="16">로그인 / 회원가입</text>

    <path d="M 190 250 V 280 H 350 V 310" stroke="#ccc" stroke-width="2" fill="none"/>
    <path d="M 350 360 V 390" stroke="#ccc" stroke-width="2" fill="none"/>

    <rect x="260" y="310" width="180" height="50" rx="10" ry="10" fill="#eef7ff" stroke="#87c0f5" stroke-width="2"/>
    <text x="350" y="340" text-anchor="middle" font-size="16">메인 대시보드</text>
    
    <rect x="100" y="390" width="150" height="40" rx="5" ry="5" fill="#f0f0f0" stroke="#ddd"/>
    <text x="175" y="415" text-anchor="middle" font-size="14">고양이 프로필 관리</text>
    
    <rect x="270" y="390" width="150" height="40" rx="5" ry="5" fill="#f0f0f0" stroke="#ddd"/>
    <text x="345" y="415" text-anchor="middle" font-size="14">건강 기록 추가</text>
    
    <rect x="440" y="390" width="150" height="40" rx="5" ry="5" fill="#f0f0f0" stroke="#ddd"/>
    <text x="515" y="415" text-anchor="middle" font-size="14">혈액검사 기록 보기</text>
  </g>

  <g id="userflow">
    <text x="700" y="150" font-size="20" font-weight="bold" fill="#000">2. 사용자 흐름 (건강 기록 추가)</text>

    <rect x="700" y="200" width="120" height="50" rx="25" fill="#d4edda" stroke="#c3e6cb"/>
    <text x="760" y="230" text-anchor="middle">시작</text>
    <path d="M 760 250 V 290" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    
    <rect x="700" y="290" width="120" height="50" rx="5" fill="#fff" stroke="#ccc"/>
    <text x="760" y="320" text-anchor="middle">로그인 페이지</text>
    <path d="M 760 340 V 380" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect x="700" y="380" width="120" height="50" rx="5" fill="#fff" stroke="#ccc"/>
    <text x="760" y="410" text-anchor="middle">로그인 성공</text>
    <path d="M 760 430 V 470" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    
    <rect x="700" y="470" width="120" height="50" rx="5" fill="#eef7ff" stroke="#87c0f5"/>
    <text x="760" y="500" text-anchor="middle">메인 대시보드</text>
    <path d="M 760 520 V 560" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect x="675" y="560" width="170" height="50" rx="5" fill="#fff" stroke="#ccc"/>
    <text x="760" y="580" text-anchor="middle">① 고양이 선택</text>
    <text x="760" y="600" text-anchor="middle">(CatSelector)</text>
    <path d="M 760 610 V 650" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    
    <rect x="675" y="650" width="170" height="50" rx="5" fill="#fff" stroke="#ccc"/>
    <text x="760" y="670" text-anchor="middle">② '기록 추가' 버튼 클릭</text>
    <text x="760" y="690" text-anchor="middle">(HealthTracker)</text>
    <path d="M 760 700 V 740" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect x="700" y="740" width="120" height="50" rx="5" fill="#fff" stroke="#ccc"/>
    <text x="760" y="770" text-anchor="middle">기록 폼 작성/제출</text>
    <path d="M 760 790 V 830" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    
    <rect x="700" y="830" width="120" height="50" rx="25" fill="#d4edda" stroke="#c3e6cb"/>
    <text x="760" y="860" text-anchor="middle">완료</text>
  </g>

  <g id="wireframes">
    <text x="1000" y="150" font-size="20" font-weight="bold" fill="#000">3. 와이어프레임 (주요 화면)</text>

    <text x="1150" y="190" font-size="16" text-anchor="middle" fill="#333">메인 대시보드</text>
    <rect x="1000" y="200" width="300" height="450" fill="white" stroke="#aaa" stroke-width="2"/>
    <rect x="1010" y="210" width="280" height="40" fill="#f2f2f2" stroke="#ddd"/>
    <text x="1150" y="235" text-anchor="middle" fill="#888">헤더 (로그아웃 버튼)</text>
    
    <rect x="1010" y="260" width="280" height="50" fill="#eef7ff" stroke="#87c0f5"/>
    <text x="1150" y="290" text-anchor="middle" fill="#333">고양이 선택 (CatSelector)</text>
    
    <rect x="1010" y="320" width="280" height="150" fill="#f2f2f2" stroke="#ddd"/>
    <text x="1150" y="400" text-anchor="middle" fill="#888">건강 데이터 그래프 (HealthGraph)</text>
    
    <rect x="1010" y="480" width="280" height="100" fill="#f2f2f2" stroke="#ddd"/>
    <text x="1150" y="530" text-anchor="middle" fill="#888">건강 기록 폼 (HealthTracker)</text>

    <rect x="1010" y="590" width="135" height="50" fill="#d4edda" stroke="#c3e6cb"/>
    <text x="1077.5" y="620" text-anchor="middle">혈액검사 보기</text>

    <rect x="1155" y="590" width="135" height="50" fill="#d4edda" stroke="#c3e6cb"/>
    <text x="1222.5" y="620" text-anchor="middle">기록 추가</text>
    
    <text x="1450" y="190" font-size="16" text-anchor="middle" fill="#333">로그인 페이지</text>
    <rect x="1350" y="200" width="200" height="280" fill="white" stroke="#aaa" stroke-width="2"/>
    <text x="1450" y="240" text-anchor="middle" fill="#888">앱 로고</text>
    <rect x="1370" y="270" width="160" height="30" fill="#f2f2f2" stroke="#ddd"/>
    <text x="1450" y="290" text-anchor="middle" fill="#aaa" font-size="14">이메일 입력</text>
    <rect x="1370" y="310" width="160" height="30" fill="#f2f2f2" stroke="#ddd"/>
    <text x="1450" y="330" text-anchor="middle" fill="#aaa" font-size="14">비밀번호 입력</text>
    <rect x="1370" y="350" width="160" height="40" fill="#87c0f5" stroke="#67a0d5"/>
    <text x="1450" y="375" text-anchor="middle" fill="white">로그인</text>
    <text x="1450" y="420" text-anchor="middle" fill="#007bff" font-size="14">회원가입 하러가기</text>

  </g>
</svg>